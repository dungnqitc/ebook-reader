<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ebook Reader</title>
  <style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --text: #222;
  --muted: #777;
  --border: #e0e0dc;
  --accent: #3b6ea5;
  --toolbar-h: 52px;
  --status-h: 28px;
}

[data-theme="dark"] {
  --bg: #1e1e1e;
  --surface: #262626;
  --text: #ddd;
  --muted: #999;
  --border: #3a3a3a;
  --accent: #6ea0d8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
/* Layout dọc: toolbar - reader(co giãn) - statusbar.
   Dùng flex thay vì calc() để không phụ thuộc chiều cao toolbar
   (toolbar có thể wrap nhiều dòng trên điện thoại). */
body {
  display: flex;
  flex-direction: column;
}

/* Toolbar */
.toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  min-height: var(--toolbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.toolbar-left, .toolbar-right { display: flex; gap: 8px; align-items: center; }
.toolbar-center {
  flex: 1;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.btn {
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 14px;
  user-select: none;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.icon { padding: 6px 10px; min-width: 36px; }

/* Reader area */
.reader {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: stretch;
  overflow: hidden;
}
#viewer {
  flex: 1;
  height: 100%;
  margin: 0 56px;
  min-width: 0;
  overflow: hidden;
}

.nav-arrow {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 56px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 48px;
  cursor: pointer;
  z-index: 5;
}
.nav-arrow:hover:not(:disabled) { color: var(--accent); background: rgba(0,0,0,0.03); }
.nav-arrow:disabled { opacity: 0.2; cursor: default; }
.nav-arrow.left { left: 0; }
.nav-arrow.right { right: 0; }

/* TOC panel */
.toc-panel {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 300px;
  max-width: 85vw;
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 20;
  display: flex;
  flex-direction: column;
}

/* Lớp phủ mờ phía sau panel; bấm vào để đóng panel */
.backdrop {
  position: absolute;
  top: 0;
  left: 0; right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 15;
}
.backdrop[hidden] { display: none; }
.toc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}
#toc-list {
  overflow-y: auto;
  padding: 8px 0;
}
#toc-list a {
  display: block;
  padding: 8px 14px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  border-left: 3px solid transparent;
}
#toc-list a:hover { background: var(--bg); border-left-color: var(--accent); }

/* Library panel */
#library-list {
  overflow-y: auto;
  padding: 8px 0;
}
#library-list a {
  display: block;
  padding: 10px 14px;
  color: var(--text);
  text-decoration: none;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--border);
}
#library-list a:hover { background: var(--bg); border-left-color: var(--accent); }
.lib-title { font-size: 14px; font-weight: 600; }
.lib-author { font-size: 12px; color: var(--muted); margin-top: 2px; }
.library-msg { padding: 14px; font-size: 13px; color: var(--muted); }

/* Bookmark panel */
#bookmark-list { overflow-y: auto; padding: 8px 0; }
.bookmark-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.bookmark-item .bm-go {
  flex: 1;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
}
.bookmark-item .bm-go:hover { color: var(--accent); }
.bookmark-item .bm-del {
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  padding: 0 4px;
}
.bookmark-item .bm-del:hover { color: #c0392b; }
#bm-btn.active { color: var(--accent); border-color: var(--accent); }

/* Drop hint */
.drop-hint {
  position: absolute;
  top: 0;
  left: 0; right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--muted);
  pointer-events: none;
  padding: 0 16px;
}
.drop-hint.dragover { background: rgba(59,110,165,0.08); outline: 2px dashed var(--accent); outline-offset: -12px; }
.drop-hint .big { font-size: 22px; margin: 0 0 8px; }
.drop-hint .small { font-size: 13px; margin-top: 16px; opacity: 0.8; }
.drop-hint[hidden] { display: none; }

/* Status bar */
.statusbar {
  flex: 0 0 auto;
  min-height: var(--status-h);
  display: flex;
  align-items: center;
  padding: 0 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
}

/* ---- Responsive: màn hình hẹp (điện thoại) ---- */
@media (max-width: 600px) {
  .toolbar {
    flex-wrap: wrap;
    padding: 6px 8px;
    gap: 6px;
  }
  .toolbar-center {
    order: 3;
    flex-basis: 100%;
    text-align: left;
    font-size: 13px;
  }
  .btn { padding: 6px 10px; font-size: 13px; }
  /* Thu hẹp vùng mũi tên để chừa tối đa chỗ cho chữ */
  #viewer { margin: 0 40px; }
  .nav-arrow { width: 40px; font-size: 36px; }
  .toc-panel { width: 280px; }
}

/* Khi chiều cao thấp (xoay ngang điện thoại) vẫn dùng tốt */
@media (max-height: 420px) {
  .drop-hint .big { font-size: 18px; }
  .drop-hint .small { margin-top: 8px; }
}
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <label for="file-input" class="btn" id="open-btn">Mở EPUB</label>
      <input type="file" id="file-input" accept=".epub" hidden />
      <button class="btn" id="library-btn">Thư viện</button>
      <button class="btn" id="toc-btn" disabled>Mục lục</button>
      <button class="btn" id="bookmarks-btn" disabled>Dấu trang</button>
      <button class="btn icon" id="bm-btn" title="Đánh dấu trang này" disabled>🔖</button>
    </div>
    <div class="toolbar-center">
      <span id="book-title">Chưa có sách</span>
    </div>
    <div class="toolbar-right">
      <button class="btn icon" id="font-dec" title="Giảm cỡ chữ" disabled>A-</button>
      <button class="btn icon" id="font-inc" title="Tăng cỡ chữ" disabled>A+</button>
      <button class="btn icon" id="theme-btn" title="Chế độ tối">🌙</button>
    </div>
  </header>

  <main class="reader">
    <button class="nav-arrow left" id="prev-btn" title="Trang trước (←)" disabled>‹</button>
    <div id="viewer"></div>
    <button class="nav-arrow right" id="next-btn" title="Trang sau (→)" disabled>›</button>

    <div class="drop-hint" id="drop-hint">
      <div>
        <p class="big">📖 Kéo thả file EPUB vào đây</p>
        <p>hoặc bấm "Mở EPUB" / "Thư viện" ở trên</p>
        <p class="small">Dùng phím ← → để chuyển trang</p>
      </div>
    </div>

    <div class="backdrop" id="backdrop" hidden></div>

    <aside class="toc-panel" id="toc-panel" hidden>
      <div class="toc-header">
        <span>Mục lục</span>
        <button class="btn icon" id="toc-close">✕</button>
      </div>
      <nav id="toc-list"></nav>
    </aside>

    <aside class="toc-panel library-panel" id="library-panel" hidden>
      <div class="toc-header">
        <span>Thư viện sách</span>
        <button class="btn icon" id="library-close">✕</button>
      </div>
      <div id="library-list"></div>
    </aside>

    <aside class="toc-panel bookmark-panel" id="bookmark-panel" hidden>
      <div class="toc-header">
        <span>Dấu trang</span>
        <button class="btn icon" id="bookmark-close">✕</button>
      </div>
      <div id="bookmark-list"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="progress">—</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script>
(function () {
  "use strict";

  // DOM refs
  const fileInput = document.getElementById("file-input");
  const viewer = document.getElementById("viewer");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const tocBtn = document.getElementById("toc-btn");
  const tocPanel = document.getElementById("toc-panel");
  const tocList = document.getElementById("toc-list");
  const tocClose = document.getElementById("toc-close");
  const bookTitle = document.getElementById("book-title");
  const progress = document.getElementById("progress");
  const dropHint = document.getElementById("drop-hint");
  const fontInc = document.getElementById("font-inc");
  const fontDec = document.getElementById("font-dec");
  const themeBtn = document.getElementById("theme-btn");
  const libraryBtn = document.getElementById("library-btn");
  const libraryPanel = document.getElementById("library-panel");
  const libraryClose = document.getElementById("library-close");
  const libraryList = document.getElementById("library-list");
  const bookmarksBtn = document.getElementById("bookmarks-btn");
  const bmBtn = document.getElementById("bm-btn");
  const bookmarkPanel = document.getElementById("bookmark-panel");
  const bookmarkClose = document.getElementById("bookmark-close");
  const bookmarkList = document.getElementById("bookmark-list");
  const backdrop = document.getElementById("backdrop");

  let book = null;
  let rendition = null;
  let fontSize = 100; // percent
  let currentBookKey = null; // định danh sách đang đọc, dùng cho bookmark
  let currentCfi = null;     // vị trí hiện tại
  const LOCATION_KEY = "ebook-reader:lastLocation";
  const BOOKMARKS_KEY = "ebook-reader:bookmarks";

  // ---- Theme ----
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem("ebook-reader:theme", theme);
    applyRenditionTheme();
  }
  function applyRenditionTheme() {
    if (!rendition) return;
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    rendition.themes.override("color", dark ? "#ddd" : "#222");
    rendition.themes.override("background", dark ? "#262626" : "#ffffff");
  }
  themeBtn.addEventListener("click", function () {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });
  applyTheme(localStorage.getItem("ebook-reader:theme") || "light");

  // ---- Load a book from an ArrayBuffer ----
  function loadBook(arrayBuffer) {
    if (rendition) rendition.destroy();
    if (book) book.destroy();

    book = ePub(arrayBuffer);
    rendition = book.renderTo(viewer, {
      // Dùng kích thước thật của #viewer để epub.js phân trang khớp khung,
      // tránh tràn/cắt chữ. resizeToViewer() sẽ cập nhật khi khung đổi.
      width: viewer.clientWidth,
      height: viewer.clientHeight,
      flow: "paginated",
      spread: "none",
    });

    dropHint.setAttribute("hidden", "");
    observeViewerSize();

    // Restore last location for this session, else start at beginning
    const saved = localStorage.getItem(LOCATION_KEY);
    rendition.display(saved || undefined);

    applyFontSize();
    applyRenditionTheme();

    book.loaded.metadata.then(function (meta) {
      bookTitle.textContent = meta.title || "Không có tiêu đề";
      document.title = (meta.title || "Ebook") + " — Ebook Reader";
    });

    book.loaded.navigation.then(function (nav) {
      buildToc(nav.toc);
    });

    book.ready.then(function () {
      return book.locations.generate(1000);
    }).then(function () {
      updateProgress();
    });

    rendition.on("relocated", function (location) {
      localStorage.setItem(LOCATION_KEY, location.start.cfi);
      currentCfi = location.start.cfi;
      updateProgress();
      updateBookmarkButton();
      // Nav buttons reflect boundaries
      prevBtn.disabled = !!location.atStart;
      nextBtn.disabled = !!location.atEnd;
    });

    // Keep arrow keys working even when focus is inside the iframe
    rendition.on("keyup", onKeyUp);

    enableControls(true);
  }

  function updateProgress() {
    if (!book || !rendition || !rendition.location) {
      progress.textContent = "—";
      return;
    }
    const loc = rendition.location;
    if (book.locations && book.locations.length()) {
      const pct = Math.round(
        book.locations.percentageFromCfi(loc.start.cfi) * 100
      );
      progress.textContent = "Tiến độ: " + pct + "%";
    } else {
      progress.textContent = "Đang đọc…";
    }
  }

  // ---- Table of contents ----
  function buildToc(toc) {
    tocList.innerHTML = "";
    toc.forEach(function (item) {
      const a = document.createElement("a");
      a.textContent = item.label.trim();
      a.href = "#";
      a.addEventListener("click", function (e) {
        e.preventDefault();
        rendition.display(item.href);
        closeAllPanels();
      });
      tocList.appendChild(a);
    });
  }

  // ---- Font size ----
  function applyFontSize() {
    if (!rendition) return;
    rendition.themes.fontSize(fontSize + "%");
    // Đổi cỡ chữ làm số trang thay đổi -> yêu cầu epub.js tính lại
    setTimeout(resizeToViewer, 60);
  }
  fontInc.addEventListener("click", function () {
    fontSize = Math.min(fontSize + 10, 200);
    applyFontSize();
  });
  fontDec.addEventListener("click", function () {
    fontSize = Math.max(fontSize - 10, 60);
    applyFontSize();
  });

  // ---- Navigation ----
  function goPrev() { if (rendition) rendition.prev(); }
  function goNext() { if (rendition) rendition.next(); }
  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);

  function onKeyUp(e) {
    const key = e.key;
    if (key === "ArrowLeft") { goPrev(); e.preventDefault(); }
    else if (key === "ArrowRight") { goNext(); e.preventDefault(); }
  }
  document.addEventListener("keyup", onKeyUp);

  // ---- Quản lý panel: chỉ một panel mở tại một thời điểm ----
  // Panel là overlay phủ lên (kèm backdrop), KHÔNG đẩy nội dung, nên kích
  // thước vùng đọc không đổi khi mở/đóng panel -> không cần resize lại.
  const allPanels = [tocPanel, libraryPanel, bookmarkPanel];

  function closeAllPanels() {
    allPanels.forEach(function (p) { p.hidden = true; });
    backdrop.hidden = true;
  }

  function togglePanel(panel) {
    const willOpen = panel.hidden;
    allPanels.forEach(function (p) { p.hidden = true; });
    panel.hidden = !willOpen;
    backdrop.hidden = !willOpen;
  }

  backdrop.addEventListener("click", closeAllPanels);

  // ---- Auto-fit: epub.js phân trang theo đúng kích thước #viewer ----
  // Gọi khi cửa sổ đổi kích thước / xoay màn hình / đổi cỡ chữ.
  function resizeToViewer() {
    if (!rendition) return;
    const w = viewer.clientWidth;
    const h = viewer.clientHeight;
    if (w <= 0 || h <= 0) return; // khung chưa có kích thước (vd đang ẩn)
    try { rendition.resize(w, h); } catch (e) { /* no-op */ }
  }

  // Theo dõi kích thước thật của #viewer. ResizeObserver bắt mọi thay đổi
  // (resize cửa sổ, xoay thiết bị, thanh địa chỉ mobile co/giãn...).
  let _resizeTimer = null;
  let _viewerObserver = null;
  function observeViewerSize() {
    if (_viewerObserver || typeof ResizeObserver === "undefined") return;
    _viewerObserver = new ResizeObserver(function () {
      // debounce để tránh gọi resize dồn dập khi đang kéo
      if (_resizeTimer) clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(resizeToViewer, 150);
    });
    _viewerObserver.observe(viewer);
  }

  // Fallback cho trình duyệt không hỗ trợ ResizeObserver
  window.addEventListener("resize", function () {
    if (typeof ResizeObserver !== "undefined") return;
    if (_resizeTimer) clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(resizeToViewer, 150);
  });
  // Xoay màn hình điện thoại
  window.addEventListener("orientationchange", function () {
    setTimeout(resizeToViewer, 300);
  });

  // ---- TOC toggle ----
  tocBtn.addEventListener("click", function () {
    togglePanel(tocPanel);
  });
  tocClose.addEventListener("click", closeAllPanels);

  // ---- Controls enable/disable ----
  function enableControls(on) {
    [prevBtn, nextBtn, tocBtn, fontInc, fontDec, bookmarksBtn, bmBtn].forEach(
      function (el) { el.disabled = !on; }
    );
  }

  // ---- Bookmarks ----
  // Lưu theo từng sách. currentBookKey định danh sách; nếu không có (mở file
  // local) thì dùng tiêu đề sách làm khóa.
  function getAllBookmarks() {
    try {
      return JSON.parse(localStorage.getItem(BOOKMARKS_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function saveAllBookmarks(all) {
    localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(all));
  }
  function bookKey() {
    return currentBookKey || ("title:" + (bookTitle.textContent || "unknown"));
  }
  function getBookmarks() {
    return getAllBookmarks()[bookKey()] || [];
  }
  function setBookmarks(list) {
    const all = getAllBookmarks();
    all[bookKey()] = list;
    saveAllBookmarks(all);
  }

  function isBookmarked(cfi) {
    return getBookmarks().some(function (b) { return b.cfi === cfi; });
  }

  function toggleBookmark() {
    if (!rendition || !currentCfi) return;
    const list = getBookmarks();
    const idx = list.findIndex(function (b) { return b.cfi === currentCfi; });
    if (idx >= 0) {
      list.splice(idx, 1); // bỏ đánh dấu
    } else {
      let label = "Vị trí đã lưu";
      if (book && book.locations && book.locations.length()) {
        const pct = Math.round(
          book.locations.percentageFromCfi(currentCfi) * 100
        );
        label = pct + "% — " + new Date().toLocaleString();
      } else {
        label = new Date().toLocaleString();
      }
      list.push({ cfi: currentCfi, label: label });
    }
    setBookmarks(list);
    updateBookmarkButton();
    if (!bookmarkPanel.hidden) renderBookmarks();
  }

  function updateBookmarkButton() {
    if (!currentCfi) { bmBtn.classList.remove("active"); return; }
    bmBtn.classList.toggle("active", isBookmarked(currentCfi));
    bmBtn.title = isBookmarked(currentCfi)
      ? "Bỏ đánh dấu trang này"
      : "Đánh dấu trang này";
  }

  function renderBookmarks() {
    bookmarkList.innerHTML = "";
    const list = getBookmarks();
    if (!list.length) {
      const msg = document.createElement("p");
      msg.className = "library-msg";
      msg.textContent = "Chưa có dấu trang nào. Bấm 🔖 để đánh dấu trang đang đọc.";
      bookmarkList.appendChild(msg);
      return;
    }
    list.forEach(function (b, i) {
      const item = document.createElement("div");
      item.className = "bookmark-item";

      const go = document.createElement("div");
      go.className = "bm-go";
      go.textContent = b.label; // textContent: an toàn trước XSS
      go.addEventListener("click", function () {
        rendition.display(b.cfi);
        closeAllPanels();
      });

      const del = document.createElement("button");
      del.className = "bm-del";
      del.textContent = "🗑";
      del.title = "Xoá dấu trang";
      del.addEventListener("click", function () {
        const cur = getBookmarks();
        cur.splice(i, 1);
        setBookmarks(cur);
        renderBookmarks();
        updateBookmarkButton();
      });

      item.appendChild(go);
      item.appendChild(del);
      bookmarkList.appendChild(item);
    });
  }

  bmBtn.addEventListener("click", toggleBookmark);
  bookmarksBtn.addEventListener("click", function () {
    togglePanel(bookmarkPanel);
    if (!bookmarkPanel.hidden) renderBookmarks();
  });
  bookmarkClose.addEventListener("click", closeAllPanels);

  // ---- Server library ----
  // Danh mục sách khai báo trong books/books.json. Vì static host (GitHub
  // Pages) không quét được thư mục, danh sách phải khai báo thủ công.
  const LIBRARY_INDEX = "books/books.json";

  function openLibraryPanel() {
    togglePanel(libraryPanel);
    if (!libraryPanel.hidden) loadLibraryIndex();
  }

  let libraryLoaded = false;
  function loadLibraryIndex() {
    if (libraryLoaded) return;
    libraryList.innerHTML = "";
    const loading = document.createElement("p");
    loading.className = "library-msg";
    loading.textContent = "Đang tải danh mục…";
    libraryList.appendChild(loading);

    fetch(LIBRARY_INDEX, { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        renderLibrary(Array.isArray(data) ? data : data.books || []);
        libraryLoaded = true;
      })
      .catch(function (err) {
        libraryList.innerHTML = "";
        const msg = document.createElement("p");
        msg.className = "library-msg";
        msg.textContent =
          "Không tải được danh mục (" + err.message +
          "). Cần có file books/books.json và chạy qua web server.";
        libraryList.appendChild(msg);
      });
  }

  function renderLibrary(books) {
    libraryList.innerHTML = "";
    if (!books.length) {
      const msg = document.createElement("p");
      msg.className = "library-msg";
      msg.textContent = "Chưa có sách nào trong thư viện.";
      libraryList.appendChild(msg);
      return;
    }
    books.forEach(function (b) {
      // Chấp nhận dạng chuỗi "ten.epub" hoặc object {file, title, author}
      const file = typeof b === "string" ? b : b.file;
      if (!file) return;
      const title = (typeof b === "object" && b.title) || file;
      const author = typeof b === "object" ? b.author : "";

      const a = document.createElement("a");
      a.href = "#";
      const t = document.createElement("div");
      t.className = "lib-title";
      t.textContent = title; // textContent chống XSS từ danh mục
      a.appendChild(t);
      if (author) {
        const au = document.createElement("div");
        au.className = "lib-author";
        au.textContent = author;
        a.appendChild(au);
      }
      a.addEventListener("click", function (e) {
        e.preventDefault();
        loadServerBook(file, title);
      });
      libraryList.appendChild(a);
    });
  }

  // Build URL an toàn: encode từng segment, giữ dấu "/"
  function buildBookUrl(file) {
    const clean = String(file).replace(/^\/+/, "");
    const parts = clean.split("/").map(encodeURIComponent);
    return "books/" + parts.join("/");
  }

  function loadServerBook(file, title) {
    const url = buildBookUrl(file);
    bookTitle.textContent = "Đang tải: " + (title || file) + "…";
    fetch(url, { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.arrayBuffer();
      })
      .then(function (buf) {
        localStorage.removeItem(LOCATION_KEY);
        currentBookKey = "server:" + file;
        loadBook(buf);
        closeAllPanels();
      })
      .catch(function (err) {
        bookTitle.textContent = "Chưa có sách";
        alert("Không tải được sách: " + err.message);
      });
  }

  libraryBtn.addEventListener("click", openLibraryPanel);
  libraryClose.addEventListener("click", closeAllPanels);

  // ---- File handling ----
  function handleFile(file) {
    if (!file) return;
    if (!/\.epub$/i.test(file.name)) {
      alert("Vui lòng chọn file .epub");
      return;
    }
    // Reset saved location when opening a new file
    localStorage.removeItem(LOCATION_KEY);
    currentBookKey = "local:" + file.name;
    const reader = new FileReader();
    reader.onload = function (e) { loadBook(e.target.result); };
    reader.onerror = function () { alert("Không đọc được file."); };
    reader.readAsArrayBuffer(file);
  }

  fileInput.addEventListener("change", function (e) {
    handleFile(e.target.files[0]);
  });

  // ---- Drag & drop ----
  const dropZone = document.body;
  ["dragenter", "dragover"].forEach(function (evt) {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      dropHint.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    dropZone.addEventListener(evt, function (e) {
      e.preventDefault();
      if (evt === "dragleave" && e.relatedTarget) return;
      dropHint.classList.remove("dragover");
    });
  });
  dropZone.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
})();
  </script>
</body>
</html>
